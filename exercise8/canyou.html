<!doctype html>
<html lang="en-US">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Can You Hear Me?</title>
    <style>
        body {
            padding-top: 2%;
            padding-bottom: 2%;
            background-color: lightblue;
            color: lightcoral;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            font-style: italic;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <script>
        for (let i = 1; i <= 32; i++) {
            let size = 12 + i * 3;
            document.write(`<p style="font-size:${size}px;line-height:1;"> Can you hear me?</p>`);
        }
    </script>
    <script>
        for (let i = 32; i >= 1; i--) {
            let size = 12 + i * 3;
            document.write(`<p style="font-size:${size}px; line-height:1;">Can you hear me?</p>`);
        }
    </script>
</body>
