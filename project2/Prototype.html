<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>Minerva Project</title>
    <meta name="viewport" content="width=device-width">

    <style>
        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            color: #32CD99;
            background-color: black;
        }

        .barcontainer {
            padding: 20px;
            max-width: 600px;
            margin: auto;
            align-items: center;

        }

        .progress-bg {
            background-color: transparent;
            border: dashed, 2px, #32CD99;
            width: 100%;
            border-radius: 10px;
        }

        .progress-bar {
            background-color: #32cd99;
            height: 25px;
            width: 0.1%;
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        .btn {
            background-color: transparent;
            color: #32CD99;
            padding: 8px 16px;
            border: dashed, 2px, #32CD99;
            margin-top: 12px;
            cursor: pointer;
            border-radius: 10px;
            font-size: 12px;
        }

        .btn:hover {
            background-color: #32CD99;
            color: aliceblue;
        }

        p {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="barcontainer">
        <div class="progress-bg">
            <div id="myBar" class="progress-bar"></div>
        </div>

        <p id="demo">0%</p>

        <button class="btn" onclick="move()">Time Jump!</button>
    </div>

    <script>
        function move() {
            const elem = document.getElementById("myBar");
            const label = document.getElementById("demo");

            let current = parseInt(elem.style.width) || 0;

            let target = current + 10;
            if (target > 100) target = 100;

            let id = setInterval(frame, 10);

            function frame() {
                if (current >= target) {
                    clearInterval(id);
                } else {
                    current++;
                    elem.style.width = current + '%';
                    label.innerHTML = current + '%';
                }
            }
        }
    </script>

</body>

</html>
